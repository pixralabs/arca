# Enable Gradle Daemon and Parallel builds
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Increase JVM Memory for large monorepos
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
newArchEnabled=true
hermesEnabled=true
VisionCamera_enableCodeScanner=true

ARCA_UPLOAD_STORE_FILE=release.keystore
ARCA_UPLOAD_KEY_ALIAS=arca-release
ARCA_UPLOAD_STORE_PASSWORD=ArcaPass123
ARCA_UPLOAD_KEY_PASSWORD=ArcaPass123
