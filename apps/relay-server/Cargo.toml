[package]
name = "vaultguard-relay-server"
version = "0.5.0"
edition = "2021"
authors = ["Radhe Bharadwaj <radhebw@gmail.com>", "Pixra Labs"]
description = "Zero-Knowledge Blind Relay Server for Arca by Pixra (VaultGuard)"
license = "AGPL-3.0"

[[bin]]
name = "vaultguard-relay-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
