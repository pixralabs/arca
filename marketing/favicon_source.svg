<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Studio Radial Obsidian Background -->
    <radialGradient id="fav-bg" cx="160" cy="130" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d2f3b" />
      <stop offset="48%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Chiseled Specular Platinum Rim Gradient -->
    <linearGradient id="fav-rim" x1="20" y1="20" x2="492" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#f0f1f5" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#9ea0a8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#52545d" stop-opacity="0.9" />
    </linearGradient>

    <!-- Brushed Platinum Shackle Gradient -->
    <linearGradient id="fav-shackle" x1="186" y1="108" x2="326" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e4e4e7" />
      <stop offset="70%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <!-- 3D Luxury Satin Silver-White Padlock Body Gradient -->
    <radialGradient id="fav-body" cx="210" cy="270" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f4f4f5" />
      <stop offset="80%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#c4c4c8" />
    </radialGradient>

    <!-- Keyhole Bevel Rim -->
    <linearGradient id="fav-key-bevel" x1="234" y1="264" x2="278" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <clipPath id="fav-squircle-clip">
      <rect x="14" y="14" width="484" height="484" rx="116" />
    </clipPath>
  </defs>

  <!-- 1. Squircle Obsidian Tile -->
  <rect x="14" y="14" width="484" height="484" rx="116" fill="url(#fav-bg)" />

  <!-- 2. Scaled Luxury Padlock (Group with Scale 1.14 & Centered for Optimal Tab Fill) -->
  <g clip-path="url(#fav-squircle-clip)">
    <g transform="translate(256, 260) scale(1.14) translate(-256, -260)">
      <!-- Ground Shadow -->
      <ellipse cx="256" cy="402" rx="126" ry="15" fill="#000000" fill-opacity="0.65" />

      <!-- U-Shackle Outer Dark Shadow -->
      <path
        d="M188 232 V174 C188 134.235 218.445 102 256 102 C293.555 102 324 134.235 324 174 V232"
        stroke="#121318"
        stroke-width="48"
        stroke-linecap="round"
      />
      <!-- Brushed Platinum Shackle Inner Fill -->
      <path
        d="M188 232 V174 C188 134.235 218.445 102 256 102 C293.555 102 324 134.235 324 174 V232"
        stroke="url(#fav-shackle)"
        stroke-width="32"
        stroke-linecap="round"
      />
      <!-- Shackle Specular Highlight Arc -->
      <path
        d="M180 186 V172 C180 138 206 111 242 108"
        stroke="#ffffff"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-opacity="0.95"
      />

      <!-- Padlock Body -->
      <rect
        x="130"
        y="208"
        width="252"
        height="186"
        rx="93"
        fill="url(#fav-body)"
        stroke="#121318"
        stroke-width="8"
      />

      <!-- Lock Body Upper-Left Glossy Specular Arc -->
      <path
        d="M153 278 C161 247 184 228 214 223"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round"
        stroke-opacity="0.95"
      />

      <!-- Keyhole Bevel & Core -->
      <g transform="translate(0, 2)">
        <circle cx="256" cy="288" r="21" fill="url(#fav-key-bevel)" />
        <path
          d="M245 298 L240 332 C239 338 243.5 343 249.5 343 H262.5 C268.5 343 273 338 272 332 L267 298 Z"
          fill="url(#fav-key-bevel)"
        />
      </g>
      <circle cx="256" cy="288" r="17.5" fill="#121318" />
      <path
        d="M247.5 297 L243 329 C242.2 334.2 246 338.5 251.2 338.5 H260.8 C266 338.5 269.8 334.2 269 329 L264.5 297 Z"
        fill="#121318"
      />
    </g>
  </g>

  <!-- 3. Specular Chiseled Platinum Outer Rim (Layer A) -->
  <rect
    x="14"
    y="14"
    width="484"
    height="484"
    rx="116"
    stroke="url(#fav-rim)"
    stroke-width="12"
  />

  <!-- Inner Specular Micro-Line (Layer B) -->
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="110"
    stroke="#ffffff"
    stroke-opacity="0.32"
    stroke-width="2.5"
  />
</svg>
