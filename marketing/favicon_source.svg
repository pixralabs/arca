<!-- Favicon-optimized: No background, no shadow, transparent — just the clean lock icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 90 392 330" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="shackle-metal" x1="186" y1="108" x2="326" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <linearGradient id="emerald-body" x1="168" y1="204" x2="348" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="42%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="keyhole-bevel" x1="234" y1="264" x2="278" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>

  <!-- U-Shackle outer shadow outline -->
  <path
    d="M188 232 V174 C188 134.235 218.445 102 256 102 C293.555 102 324 134.235 324 174 V232"
    stroke="#121318"
    stroke-width="48"
    stroke-linecap="round"
  />
  <!-- Brushed Platinum shackle -->
  <path
    d="M188 232 V174 C188 134.235 218.445 102 256 102 C293.555 102 324 134.235 324 174 V232"
    stroke="url(#shackle-metal)"
    stroke-width="32"
    stroke-linecap="round"
  />
  <!-- Shackle right inner shadow -->
  <path
    d="M256 102 C293.555 102 324 134.235 324 174 V224"
    stroke="#52525b"
    stroke-width="10"
    stroke-linecap="round"
    stroke-opacity="0.55"
  />
  <!-- Shackle glossy highlight -->
  <path
    d="M180 186 V172 C180 138 206 111 242 108"
    stroke="#f4f4f5"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-opacity="0.92"
  />

  <!-- Emerald padlock body -->
  <rect
    x="130"
    y="208"
    width="252"
    height="186"
    rx="93"
    fill="url(#emerald-body)"
    stroke="#121318"
    stroke-width="10"
  />
  <!-- Bottom-right shadow crescent for 3D volume -->
  <path
    d="M352 246 C366 266 372 292 366 318 C356 358 318 384 274 384 H202 C180 384 160 375 146 360 C164 371 186 376 212 376 H266 C312 376 348 344 354 298 C356 280 355 262 352 246 Z"
    fill="#047857"
    fill-opacity="0.68"
  />
  <!-- Inner rim light -->
  <rect
    x="135"
    y="213"
    width="242"
    height="176"
    rx="88"
    stroke="#a7f3d0"
    stroke-opacity="0.32"
    stroke-width="3"
  />
  <!-- Glossy white highlight arc -->
  <path
    d="M153 278 C161 247 184 228 214 223"
    stroke="#ffffff"
    stroke-width="11"
    stroke-linecap="round"
    stroke-opacity="0.92"
  />

  <!-- Keyhole -->
  <g transform="translate(0, 2)">
    <circle cx="256" cy="288" r="21" fill="url(#keyhole-bevel)" />
    <path
      d="M245 298 L240 332 C239 338 243.5 343 249.5 343 H262.5 C268.5 343 273 338 272 332 L267 298 Z"
      fill="url(#keyhole-bevel)"
    />
  </g>
  <circle cx="256" cy="288" r="17.5" fill="#121318" />
  <path
    d="M247.5 297 L243 329 C242.2 334.2 246 338.5 251.2 338.5 H260.8 C266 338.5 269.8 334.2 269 329 L264.5 297 Z"
    fill="#121318"
  />
</svg>
